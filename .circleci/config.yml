version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas
          command: |
            echo "🧪 Simulando error..."
            exit 1  # Fuerza un error para probar la notificación

  notify-failure:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Enviar mensaje de error a Telegram
          command: |
            curl -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="❌ El pipeline de CircleCI falló. Revisa el proyecto JenkinsEx1."

workflows:
  version: 2
  flujo-con-error:
    jobs:
      - build
      - notify-failure:
          requires:
            - build
          filters:
            branches:
              only: main
          when: on_fail
