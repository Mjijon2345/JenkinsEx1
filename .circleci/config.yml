version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas (simula error)
          command: |
            echo "🧪 Simulando error..."
            exit 1

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Notificar por Telegram
          command: |
            curl -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="❌ El pipeline de CircleCI falló en el job de build."

workflows:
  version: 2
  flujo:
    jobs:
      - build:
          continue_on_error: true
      - notify:
          requires:
            - build
