version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/repo

jobs:
  install:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install -r requisitos.py
            pip install flake8

  test:
    executor: python-executor
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas unitarias en paralelo
          command: |
            circleci tests split test.py | xargs -n 1 python

  lint:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Analizar código con flake8
          command: flake8 . --exit-zero

  notify:
    executor: python-executor
    steps:
      - run:
          name: Enviar mensaje por Telegram
          command: |
            curl -s -X POST https://api.telegram.org/bot7534877343:AAEemGGoNy9A2b6irCXCt6VCYISGEnyZzl8sendMessage \
              -d chat_id=1122221631 
              -d text="✅ Pipeline JenkinsEx1 finalizado con éxito."

workflows:
  version: 2
  flujo:
    jobs:
      - install
      - test:
          requires: [install]
      - lint:
          requires: [install]
      - notify:
          requires: [test, lint]
