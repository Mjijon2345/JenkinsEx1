version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Simular error y guardar estado
          command: |
            echo "❌ Falla simulada"
            echo "failed" > status.txt
      - persist_to_workspace:
          root: .
          paths:
            - status.txt

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /workspace
      - run:
          name: Leer estado y enviar notificación a Telegram
          command: |
            STATUS=$(cat /workspace/status.txt)
            if [ "$STATUS" = "failed" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="❌ El job 'build' falló en el pipeline *${CIRCLE_BUILD_URL}*" \
                -d parse_mode="Markdown"
            fi

workflows:
  version: 2
  flujo:
    jobs:
      - build
      - notify:
          requires:
            - build
