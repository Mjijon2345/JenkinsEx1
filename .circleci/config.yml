version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11

jobs:
  instalar-dependencias:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install -r requirements.txt
            pip install pytest flake8
      - persist_to_workspace:
          root: .
          paths:
            - .

  test-1:
    executor: python-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar prueba suma
          command: pytest Pipeline_Jenkins/test.py -k "suma"

  test-2:
    executor: python-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar prueba resta
          command: pytest Pipeline_Jenkins/test.py -k "resta"

  flake8-analysis:
    executor: python-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar flake8
          command: flake8 .

  notify:
    executor: python-executor
    steps:
      - run:
          name: Enviar notificación Telegram
          command: |
            curl -s -X POST https://api.telegram.org/bot7534877343:AAEemGGoNy9A2b6irCXCt6VCYISGEnyZzl8/sendMessage \
              -d chat_id=1122221631 \
              -d text="🚨 Falló el pipeline JenkinsEx1. Revisa CircleCI."

workflows:
  flujo:
    jobs:
      - instalar-dependencias
      - test-1:
          requires:
            - instalar-dependencias
      - test-2:
          requires:
            - instalar-dependencias
      - flake8-analysis:
          requires:
            - instalar-dependencias
      - notify:
          requires:
            - test-1
            - test-2
            - flake8-analysis
