version: 2.1

jobs:
  instalar-dependencias:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install -r requirements.txt
            pip install flake8 pytest
      - persist_to_workspace:
          root: .
          paths:
            - .

  test-1:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar prueba suma
          command: |
            pip install -r requirements.txt
            pip install pytest
            pytest Pipeline_Jenkins/test.py -k "suma"

  test-2:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar prueba resta
          command: |
            pip install -r requirements.txt
            pip install pytest
            pytest Pipeline_Jenkins/test.py -k "resta"

  flake8-analysis:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Análisis con flake8
          command: |
            pip install -r requirements.txt
            pip install flake8
            flake8 .

  notify:
    docker:
      - image: cimg/python:3.11
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Enviar notificación a Telegram
          command: |
            curl -s -X POST https://api.telegram.org/bot7534877343:AAEemGGoNy9A2b6irCXCt6VCYISGEnyZzl8/sendMessage \
              -d chat_id=1122221631 \
              -d text="📣 El pipeline JenkinsEx1 ha finalizado. Verifica los resultados en CircleCI."

workflows:
  flujo:
    jobs:
      - instalar-dependencias
      - test-1:
          requires:
            - instalar-dependencias
      - test-2:
          requires:
            - instalar-dependencias
      - flake8-analysis:
          requires:
            - instalar-dependencias
      - notify:
          requires:
            - test-1
            - test-2
            - flake8-analysis
