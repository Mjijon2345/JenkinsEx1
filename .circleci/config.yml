version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Simular error
          command: |
            echo "🧪 Falla simulada"
            exit 1

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Enviar notificación si falló build
          command: |
            if [ "${CIRCLE_JOB_STATUS}" = "failed" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                -d text="❌ El pipeline falló en el job 'build'"
            else
              echo "✅ El job anterior no falló, no se envía notificación."
            fi

workflows:
  version: 2
  flujo:
    jobs:
      - build
      - notify:
          requires:
            - build
