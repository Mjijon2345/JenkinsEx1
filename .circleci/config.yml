version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: pip install -r requirements.txt
      - run:
          name: Ejecutar pruebas
          command: pytest

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Enviar notificación a Telegram
          command: |
            curl -s -X POST https://api.telegram.org/bot7534877343:AAEemGGoNy9A2b6irCXCt6VCYISGEnyZzl8/sendMessage \
              -d chat_id=1122221631 \
              -d text="✅ El pipeline de CircleCI finalizó correctamente."

workflows:
  version: 2
  flujo:
    jobs:
      - build
      - notify:
          requires:
            - build
