version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project

jobs:
  instalar:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install -r requirements.txt
            pip install flake8

  test1:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas 1
          command: pytest test.py -k "suma"

  test2:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas 2
          command: pytest test.py -k "resta"

  test3:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas 3
          command: pytest test.py -k "multiplicacion"

workflows:
  version: 2
  paralelo:
    jobs:
      - instalar
      - test1:
          requires:
            - instalar
      - test2:
          requires:
            - instalar
      - test3:
          requires:
            - instalar
