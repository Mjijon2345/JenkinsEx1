version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas
          command: |
            echo "✅ Pruebas ejecutadas exitosamente"

  notify-success:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Enviar mensaje de éxito a Telegram
          command: |
            curl -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="✅ Pipeline ejecutado correctamente en CircleCI para el proyecto JenkinsEx1 🎉"

workflows:
  version: 2
  flujo-completo:
    jobs:
      - build
      - notify-success:
          requires:
            - build
