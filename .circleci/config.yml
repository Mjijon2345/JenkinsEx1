version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11.1

jobs:
  install-dependencies:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install -r requirements.txt
            pip install flake8

  test-parte-1:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas - parte 1
          command: pytest test.py -k "suma"

  test-parte-2:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas - parte 2
          command: pytest test.py -k "resta"

  flake8-analysis:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Análisis con flake8
          command: flake8 .

  notify:
    executor: python-executor
    steps:
      - run:
          name: Enviar notificación Telegram
          command: |
            curl -s -X POST https://api.telegram.org/bot${7534877343:AAEemGGoNy9A2b6irCXCt6VCYISGEnyZzl8}/sendMessage \
              -d chat_id=${1122221631} \
              -d text="📣 El pipeline ha finalizado. Revisa los resultados en CircleCI."

workflows:
  version: 2
  flujo:
    jobs:
      - install-dependencies
      - test-parte-1:
          requires:
            - install-dependencies
      - test-parte-2:
          requires:
            - install-dependencies
      - flake8-analysis:
          requires:
            - install-dependencies
      - notify:
          requires:
            - test-parte-1
            - test-parte-2
            - flake8-analysis
          # Esto es clave para que se ejecute SIEMPRE:
          when: always
