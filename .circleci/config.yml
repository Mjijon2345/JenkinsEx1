version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11

jobs:
  test-job:
    parameters:
      param:
        type: string
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            pip install -r requisitos.py
      - run:
          name: Ejecutar pruebas con param << parameters.param >>
          command: |
            pytest test.py -k "<< parameters.param >>"

workflows:
  version: 2
  pruebas-paralelas:
    jobs:
      - test-job:
          matrix:
            parameters:
              param: ["A", "B", "C"]
